name: crc-probe

# 在免费 runner 上编译社区树，判定其 ABI 能否与一加 13T 出厂 vendor 模块配套。
# 纯离线判定，不涉及任何设备操作。
#
# 关于下载：runner 位于海外机房，clone github.com 与 apt 均为同机房直连，
# 因此不使用任何加速前缀（gh-proxy 之类只会绕路变慢）。
# CRC 由 genksyms 依据源码结构生成，与编译器版本无关，
# 故不下载 1 GB 的 Android clang，直接用 runner 自带 clang-18。

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '社区树分支'
        required: false
        default: 'oneplus/sm8750_b_16.0.0_oneplus_13_6.6.118'
      target:
        description: '编译目标（all 才会生成 Module.symvers）'
        required: false
        default: 'all'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/work
          sudo chown "$(id -u):$(id -g)" /mnt/work
          df -h / /mnt
          echo "node: $(node --version)"
          echo "cpu: $(nproc)   mem: $(free -g | awk '/^Mem/{print $2}')G"

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bison flex libelf-dev libssl-dev bc cpio zip rsync dwarves git python3
          clang --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      - name: 克隆社区树
        run: |
          cd /mnt/work
          git clone --depth=1 -b '${{ inputs.branch }}' \
            https://github.com/cctv18/android_kernel_common_oneplus_sm8750 common
          cd common
          git log -1 --format='%H  %ci  %s'
          du -sh /mnt/work/common
          df -h /mnt | tail -1

      - name: 注入 HMBIRD 配置
        run: |
          cd /mnt/work/common
          # 设备实测 .config 中 CONFIG_HMBIRD_SCHED=y；官方 OSS 源码无该实现，社区树有
          printf '\nCONFIG_HMBIRD_SCHED=y\nCONFIG_MODULE_SCMVERSION=y\n' >> arch/arm64/configs/gki_defconfig
          tail -4 arch/arm64/configs/gki_defconfig
          sed -i 's/check_defconfig//' build.config.gki || true

      - name: 生成 .config
        run: |
          cd /mnt/work/common
          make LLVM=-18 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTCC=clang HOSTLD=ld.lld \
            O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          echo '--- 关键配置是否生效 ---'
          grep -E 'HMBIRD|MODVERSIONS|TRIM_UNUSED_KSYMS' out/.config || echo '(未找到，需检查 Kconfig 依赖)'

      - name: 编译
        run: |
          cd /mnt/work/common
          make -j"$(nproc)" LLVM=-18 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=aarch64-linux-gnu- \
            CC=clang LD=ld.lld HOSTCC=clang HOSTLD=ld.lld \
            O=out KCFLAGS+=-O2 KCFLAGS+=-Wno-error \
            ${{ inputs.target }}
          echo '--- 产物 ---'
          ls -l out/vmlinux out/Module.symvers out/arch/arm64/boot/Image 2>/dev/null || true
          df -h /mnt | tail -1

      - name: 判定 ABI 是否匹配
        run: python3 check_crc.py /mnt/work/common/out

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crc-probe-result
          path: |
            /mnt/work/common/out/Module.symvers
            /mnt/work/common/out/.config
          if-no-files-found: warn
          retention-days: 7
